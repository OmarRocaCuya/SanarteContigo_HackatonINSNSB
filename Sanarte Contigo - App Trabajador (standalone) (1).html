document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

tion>\n              <option>Hospitalización<\u002Foption>\n              <option>Consulta Externa<\u002Foption>\n              <option>Administración<\u002Foption>\n              <option>Finanzas<\u002Foption>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n\n          <button sc-camel-on-click=\"{{ goStep3 }}\" style=\"margin-top:8px;width:100%;padding:16px;border:none;border-radius:16px;background:#2B2420;color:#FAF3EA;font-size:16px;font-weight:700;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer\">Continuar<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isStep3 }}\">\n        <div style=\"padding-top:48px;display:flex;flex-direction:column;gap:20px;animation:riseIn .5s ease\">\n          <div style=\"display:flex;gap:6px\">\n            <div style=\"height:4px;flex:1;border-radius:2px;background:#2B2420\"><\u002Fdiv>\n            <div style=\"height:4px;flex:1;border-radius:2px;background:#2B2420\"><\u002Fdiv>\n            <div style=\"height:4px;flex:1;border-radius:2px;background:#2B2420\"><\u002Fdiv>\n            <div style=\"height:4px;flex:1;border-radius:2px;background:#2B2420\"><\u002Fdiv>\n            <div style=\"height:4px;flex:1;border-radius:2px;background:#E7DFD2\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:'Instrument Serif',serif;font-size:28px;color:#2B2420\">Tus datos, tus reglas<\u002Fdiv>\n            <div style=\"margin-top:6px;font-size:14px;color:#6B6058;line-height:1.5\">Cada consentimiento es independiente y puedes revocarlo cuando quieras desde Ajustes.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <button sc-camel-on-click=\"{{ toggleConsentBase }}\" style=\"text-align:left;display:flex;gap:12px;padding:16px;border-radius:16px;border:1.5px solid {{ consentBaseBorder }};background:{{ consentBaseBg }};cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif\">\n            <div style=\"width:22px;height:22px;flex:none;border-radius:7p    <\u002Fbutton>\n\n          <button sc-camel-on-click=\"{{ goStep4 }}\" disabled=\"{{ !consentBase }}\" style=\"margin-top:6px;width:100%;padding:16px;border:none;border-radius:16px;background:{{ step2ButtonBg }};color:#FAF3EA;font-size:16px;font-weight:700;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer\">Continuar<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isStep4 }}\">\n        <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px;animation:popIn .5s ease\">\n          <div style=\"width:84px;height:84px;border-radius:50%;background:#7C8C68;display:flex;align-items:center;justify-content:center\">\n            <svg width=\"40\" height=\"40\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M4 12l6 6L20 6\" stroke=\"#FAF3EA\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:'Instrument Serif',serif;font-size:30px;color:#2B2420\">Todo listo<\u002Fdiv>\n            <div style=\"margin-top:8px;font-size:14.5px;color:#6B6058;max-width:280px;line-height:1.5\">Ya ajustamos tus pausas a tu turno {{ turno }} en {{ servicio }}. Vamos a tu espacio.<\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ finishOnboarding }}\" style=\"margin-top:8px;width:100%;padding:16px;border:none;border-radius:16px;background:#2B2420;color:#FAF3EA;font-size:16px;font-weight:700;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer\">Ir a mi espacio<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isApp }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex:none;padding:18px 22px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(43,36,32,0.06);background:#FAF3EA\">\n      <div style=\"font-family:'Instrument Serif',serif;font-size:21px;color:#2B2420\">Sanarte Contigo<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:10px\">\n        <div style=\"display:flex;background:#F1E8DB;border-radius:100px;padding:3px;gap:2px\">\n          <button sc-camel-on-click=\"{{ pickAsistencial }}\" style=\"padding:6px 10px;border:none;border-radius:100px;background:{{ personaPillAsistencialBg }};color:{{ personaPillAsistencialColor }};font-size:11px;font-weight:700;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif\">Asist.<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ pickAdministrativo }}\" style=\"padding:6px 10px;border:none;border-radius:100px;background:{{ personaPillAdministrativoBg }};color:{{ personaPillAdministrativoColor }};font-size:11px;font-weight:700;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif\">Admin.<\u002Fbutton>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ openAjustes }}\" style=\"width:34px;height:34px;border-radius:50%;border:none;background:#F1E8DB;display:flex;align-items:center;justify-content:center;cursor:pointer\">\n          <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M12 15a3 3 0 100-6 3 3 0 000 6z\" stroke=\"#2B2420\" stroke-width=\"1.8\"><\u002Fpath><path d=\"M19.4 13.5a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V19.4a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1.08-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3.6a2 2 0 110-4h.09a1.65 1.65 0 001.51-1.08 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9.6a1.65 1.65 0 001-1.51V3.6a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82v.09a1.65 1.65 0 001.51 1H20.4a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z\" stroke=\"#2B2420\" stroke-width=\"1.4\"><\u002Fpath><\u002Fsvg>\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"flex:1;overflow-y:auto;position:relative\">\n\n      <sc-if value=\"{{ isTabHome }}\">\n        <div style=\"padding:22px;display:flex;flex-direction:column;gap:16px;animation:riseIn .4s ease\">\n          <div>\n            <div style=\"font-size:13px;color:#9A8F84\">{{ greeting }}<\u002Fdiv>\n            <div style=\"font-family:'Instrument Serif',serif;font-size:26px;color:#2B2420;margin-top:2px\">{{ personaLabel }} · turno {{ turno }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <button sc-camel-on-click=\"{{ openCheckin }}\" style=\"text-align:left;border:none;cursor:pointer;padding:20px;border-radius:20px;background:#2B2420;color:#FAF3EA;display:flex;flex-direction:column;gap:10px;font-family:'Plus Jakarta Sans',sans-serif\">\n            <div style=\"font-size:13px;color:#C9BFB2;font-weight:600\">Semáforo emocional<\u002Fdiv>\n            <div style=\"font-size:17px;font-weight:700;line-height:1.35\">¿Cómo te sientes en este momento del turno?<\u002Fdiv>\n            <div style=\"font-size:13px;color:#D9A441;font-weight:700\">Responder ahora →<\u002Fdiv>\n          <\u002Fbutton>\n\n          <div style=\"padding:18px;border-radius:20px;background:#F1E8DB;display:flex;flex-direction:column;gap:12px\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between\">\n              <div style=\"font-size:14.5px;font-weight:700;color:#2B2420\">Próxima pausa activa<\u002Fdiv>\n              <div style=\"font-size:12px;color:#8A7F73\">{{ nextPausaHora }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:14px;color:#6B6058\">{{ nextPausaTitulo }}<\u002Fdiv>\n            <button sc-camel-on-click=\"{{ goPausas }}\" style=\"align-self:flex-start;padding:9px 16px;border:none;border-radius:100px;background:#C1663D;color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif\">Ver mis pausas<\u002Fbutton>\n          <\u002Fdiv>\n\n          <button sc-camel-on-click=\"{{ openLikert }}\" style=\"text-align:left;border:1.5px solid #E7DFD2;cursor:pointer;padding:18px;border-radius:20px;background:#fff;display:flex;align-items:center;justify-content:space-between;font-family:'Plus Jakarta Sans',sans-serif\">\n            <div>\n              <div style=\"font-size:14px;font-weight:700;color:#2B2420\">Cuestionario de bienestar<\u002Fdiv>\n              <div style=\"margin-top:3px;font-size:12.5px;color:#8A7F73\">{{ likertStatusText }}<\u002Fdiv>\n            <\u002Fdiv>\n            <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M9 6l6 6-6 6\" stroke=\"#2B2420\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n\n          <div style=\"padding:18px;border-radius:20px;background:#E4E9DA;display:flex;align-items:center;justify-content:space-between\">\n            <div>\n              <div style=\"font-size:13px;color:#5F6B4F;font-weight:700\">Talleres Sanarte<\u002Fdiv>\n              <div style=\"margin-top:3px;font-size:12.5px;color:#5F6B4F\">{{ talleresInscritosCount }} inscripción(es) activa(s)<\u002Fdiv>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ goTalleres }}\" style=\"padding:9px 16px;border:none;border-radius:100px;background:#7C8C68;color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif\">Ver calendario<\u002Fbutton>\n          <\u002Fdiv>\n\n          <button sc-camel-on-click=\"{{ openResumenSemanal }}\" style=\"text-align:left;border:1.5px solid #E7DFD2;cursor:pointer;padding:18px;border-radius:20px;background:#fff;display:flex;align-items:center;justify-content:space-between;font-family:'Plus Jakarta Sans',sans-serif\">\n            <div>\n              <div style=\"font-size:14px;font-weight:700;color:#2B2420\">Tu semana emocional<\u002Fdiv>\n              <div style=\"margin-top:3px;font-size:12.5px;color:#8A7F73\">Un resumen simple de cómo te sentiste<\u002Fdiv>\n            <\u002Fdiv>\n            <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M9 6l6 6-6 6\" stroke=\"#2B2420\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isTabPausas }}\">\n        <div style=\"padding:22px;display:flex;flex-direction:column;gap:14px;animation:riseIn .4s ease\">\n          <div>\n            <div style=\"font-family:'Instrument Serif',serif;font-size:24px;color:#2B2420\">Pausas activas<\u002Fdiv>\n            <div style=\"margin-top:4px;font-size:13px;color:#6B6058;line-height:1.5\">Ajustadas a tu turno {{ turno }}. Posponer nunca resta puntos.<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ pausas }}\" as=\"p\" hint-placeholder-count=\"3\">\n            <div style=\"padding:16px;border-radius:18px;background:{{ p.cardBg }};border:1px solid #EFE8DB;display:flex;flex-direction:column;gap:10px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:flex-start\">\n                <div>\n                  <div style=\"font-size:12px;color:#8A7F73;font-weight:700\">{{ p.hora }} · {{ p.duracion }}<\u002Fdiv>\n                  <div style=\"margin-top:4px;font-size:15px;font-weight:700;color:#2B2420\">{{ p.titulo }}<\u002Fdiv>\n                <\u002Fdiv>\n                <button sc-camel-on-click=\"{{ p.onOpenGuide }}\" style=\"width:34px;height:34px;border-radius:10px;background:#F1E8DB;border:none;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer\">\n                  <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M8 5v14l11-7z\" fill=\"#C1663D\"><\u002Fpath><\u002Fsvg>\n                <\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:8px\">\n                <button sc-camel-on-click=\"{{ p.onOpenGuide }}\" style=\"flex:1;padding:10px;border-radius:12px;border:1.5px solid #E7DFD2;background:#fff;color:#2B2420;font-size:13px;font-weight:700;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif\">Ver guía<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ p.onToggle }}\" style=\"flex:1;padding:10px;border-radius:12px;border:none;background:{{ p.buttonBg }};color:{{ p.buttonColor }};font-size:13px;font-weight:700;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif\">{{ p.buttonLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"font-size:12px;color:#9A8F84;text-align:center;padding-top:6px\">La app reajusta tus horarios sugeridos según cuándo sueles hacer tus pausas.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isTabTalleres }}\">\n        <div style=\"padding:22px;display:flex;flex-direction:column;gap:14px;animation:riseIn .4s ease\">\n          <div>\n            <div style=\"font-family:'Instrument Serif',serif;font-size:24px;color:#2B2420\">Talleres Sanarte<\u002Fdiv>\n            <div style=\"margin-top:4px;font-size:13px;color:#6B6058\">Inscríbete y suma puntos por participar.<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ talleres }}\" as=\"t\" hint-placeholder-count=\"3\">\n            <div style=\"padding:16px;border-radius:18px;background:#fff;border:1px solid #EFE8DB;display:flex;flex-direction:column;gap:10px\">\n              <div style=\"font-size:15px;font-weight:700;color:#2B2420;line-height:1.3\">{{ t.nombre }}<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#8A7F73\">{{ t.fecha }} · {{ t.hora }} · {{ t.cuposLabel }}<\u002Fdiv>\n              <div style=\"font-size:13px;color:#6B6058;line-height:1.5\">{{ t.descripcion }}<\u002Fdiv>\n              <div style=\"font-size:12px;color:#8A7F73;font-weight:700\">Dicta: {{ t.facilitador }}<\u002Fdiv>\n              <button sc-camel-on-click=\"{{ t.onToggle }}\" style=\"padding:10px;border-radius:12px;border:none;background:{{ t.buttonBg }};color:{{ t.buttonColor }};font-size:13px;font-weight:700;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif\">{{ t.buttonLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isTabEquipo }}\">\n        <div style=\"padding:22px;display:flex;flex-direction:column;gap:16px;animation:riseIn .4s ease\">\n          <div>\n            <div style=\"font-family:'Instrument Serif',serif;font-size:24px;color:#2B2420\">Tu equipo<\u002Fdiv>\n            <div style=\"margin-top:4px;font-size:13px;color:#6B6058\">Puntaje por promedio per cápita — nadie ve el aporte de otros.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"padding:20px;border-radius:20px;background:#2B2420;color:#FAF3EA;display:flex;flex-direction:column;gap:6px\">\n            <div style=\"font-size:12.5px;color:#C9BFB2;font-weight:700\">{{ equipoNombre }}<\u002Fdiv>\n            <div style=\"font-family:'Instrument Serif',serif;font-size:34px\">{{ equipoPuntaje }} <span style=\"font-size:14px;font-family:'Plus Jakarta Sans',sans-serif;color:#C9BFB2\">pts / persona<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#D9A441;font-weight:700\">Puesto #{{ equipoPuesto }} · categoría {{ personaLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"padding:16px;border-radius:16px;background:#F1E8DB;display:flex;align-items:center;justify-content:space-between\">\n            <div>\n              <div style=\"font-size:13px;font-weight:700;color:#2B2420\">Tu aporte esta semana<\u002Fdiv>\n              <div style=\"margin-top:2px;font-size:12px;color:#8A7F73\">Pausas, check-ins, talleres y Likert<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-family:'Instrument Serif',serif;font-size:24px;color:#C1663D\">96 pts<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div>\n            <div style=\"font-size:12.5px;font-weight:700;color:#8A7F73;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px\">Ranking {{ personaLabel }}<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <sc-for list=\"{{ ranking }}\" as=\"r\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:{{ r.rowBg }}\">\n                  <div style=\"font-family:'Instrument Serif',serif;font-size:16px;color:#8A7F73;width:18px\">{{ r.pos }}<\u002Fdiv>\n                  <div style=\"flex:1;font-size:13.5px;font-weight:700;color:#2B2420\">{{ r.nombre }}<\u002Fdiv>\n                  <div style=\"font-size:13px;font-weight:700;color:#6B6058\">{{ r.puntaje }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <button sc-camel-on-click=\"{{ openCertificados }}\" style=\"text-align:left;padding:16px;border-radius:16px;border:1.5px dashed #D9A441;display:flex;gap:12px;align-items:center;background:none;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif\">\n            <div style=\"font-size:24px\">🏅<\u002Fdiv>\n            <div style=\"flex:1;font-size:12.5px;color:#8A7F73;line-height:1.5\">Reconocimiento Sanarte semanal — sin componente salarial ni de evaluación de desempeño. <span style=\"color:#C1663D;font-weight:700\">Ver certificados del equipo →<\u002Fspan><\u002Fdiv>\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ overlay }}\" hint-placeholder-val=\"{{ null }}\">\n        <div style=\"position:absolute;inset:0;background:#FAF3EA;display:flex;flex-direction:column;animation:riseIn .3s ease;z-index:5\">\n          <div style=\"flex:none;padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(43,36,32,0.06)\">\n            <button sc-camel-on-click=\"{{ closeOverlay }}\" style=\"width:32px;height:32px;border-radius:50%;border:none;background:#F1E8DB;display:flex;align-items:center;justify-content:center;cursor:pointer\">\n              <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M15 18l-6-6 6-6\" stroke=\"#2B2420\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <\u002Fbutton>\n            <div style=\"font-size:14px;font-weight:700;color:#2B2420\">{{ overlayTitle }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1;overflow-y:auto;padding:22px\">\n\n            <sc-if value=\"{{ isCheckin }}\">\n              <div style=\"display:flex;flex-direction:column;gap:18px\">\n                <div style=\"font-size:14px;color:#6B6058;line-height:1.5\">Elige lo que más se acerca a cómo te sientes ahora. Solo tú ves esta respuesta.<\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px\">\n                  <sc-for list=\"{{ moods }}\" as=\"m\" hint-placeholder-count=\"6\">\n                    <button sc-camel-on-click=\"{{ m.onClick }}\" style=\"display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;border-radius:16px;border:1.5px solid {{ m.border }};background:{{ m.bg }};cursor:pointer\">\n                      <div style=\"font-size:28px\">{{ m.emoji }}<\u002Fdiv>\n                      <div style=\"font-size:11.5px;font-weight:700;color:#2B2420\">{{ m.label }}<\u002Fdiv>\n                    <\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ isCheckinResult }}\">\n              <div style=\"display:flex;flex-direction:column;gap:16px;animation:popIn .4s ease\">\n                <div style=\"display:flex;align-items:center;gap:10px\">\n                  <div style=\"font-size:30px\">{{ selectedMoodEmoji }}<\u002Fdiv>\n                  <div>\n                    <div style=\"font-family:'Instrument Serif',serif;font-size:20px;color:#2B2420\">{{ interventionTitle }}<\u002Fdiv>\n                    <div style=\"font-size:12px;color:#9A8F84;font-weight:700\">{{ interventionTotalLabel }} · máx. 5 min<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <sc-if value=\"{{ attemptLabel }}\">\n                  <div style=\"font-size:12px;color:#C1663D;font-weight:700;background:#FBE9E0;padding:6px 10px;border-radius:8px;align-self:flex-start\">{{ attemptLabel }} · probemos otra estrategia<\u002Fdiv>\n                <\u002Fsc-if>\n\n                <div style=\"display:flex;gap:6px\">\n                  <sc-for list=\"{{ stepDots }}\" as=\"d\" hint-placeholder-count=\"3\">\n                    <div style=\"height:4px;flex:1;border-radius:2px;background:{{ d.bg }}\"><\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n\n                <div style=\"font-size:12px;color:#8A7F73;font-weight:700\">{{ stepNumberLabel }} · {{ stepDuration }}<\u002Fdiv>\n\n                <sc-if value=\"{{ isStepVideo }}\">\n                  <div style=\"border-radius:16px;background:#2B2420;aspect-ratio:16/10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#FAF3EA\">\n                    <div style=\"width:52px;height:52px;border-radius:50%;background:rgba(250,243,234,0.15);display:flex;align-items:center;justify-content:center\">\n                      <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M8 5v14l11-7z\" fill=\"#FAF3EA\"><\u002Fpath><\u002Fsvg>\n                    <\u002Fdiv>\n                    <div style=\"font-size:12px;color:#C9BFB2;padding:0 20px;text-align:center\">{{ stepLabel }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ isStepAudio }}\">\n                  <div style=\"border-radius:16px;background:#F1E8DB;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px\">\n                    <div style=\"width:52px;height:52px;border-radius:50%;background:#C1663D;display:flex;align-items:center;justify-content:center\">\n                      <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M12 3v10.55A4 4 0 1014 17V7h4V3h-6z\" fill=\"#FAF3EA\"><\u002Fpath><\u002Fsvg>\n                    <\u002Fdiv>\n                    <div style=\"font-size:12px;color:#6B6058;text-align:center\">{{ stepLabel }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n                <div style=\"font-size:14px;color:#2B2420;line-height:1.55;text-align:center\">{{ stepInstruction }}<\u002Fdiv>\n\n                <button sc-camel-on-click=\"{{ onStepAction }}\" style=\"width:100%;padding:15px;border:none;border-radius:14px;background:#2B2420;color:#FAF3EA;font-weight:700;font-size:14.5px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif\">{{ stepButtonLabel }}<\u002Fbutton>\n                <div style=\"font-size:12px;color:#9A8F84;text-align:center\">+5 pts por completar tu check-in<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ isCheckinFeedback }}\">\n              <div style=\"display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px;padding-top:20px;animation:popIn .4s ease\">\n                <div>\n                  <div style=\"font-family:'Instrument Serif',serif;font-size:22px;color:#2B2420\">¿Te sientes mejor?<\u002Fdiv>\n                  <div style=\"margin-top:6px;font-size:13.5px;color:#6B6058\">Tu respuesta nos ayuda a saber si la estrategia funcionó.<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:14px\">\n                  <button sc-camel-on-click=\"{{ onFeedbackGood }}\" style=\"display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 20px;border-radius:16px;border:1.5px solid #E7DFD2;background:#fff;cursor:pointer\">\n                    <div style=\"font-size:30px\">👍<\u002Fdiv>\n                    <div style=\"font-size:12px;font-weight:700;color:#2B2420\">Sí, mejor<\u002Fdiv>\n                  <\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ onFeedbackBad }}\" style=\"display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 20px;border-radius:16px;border:1.5px solid #E7DFD2;background:#fff;cursor:pointer\">\n                    <div style=\"font-size:30px\">😐<\u002Fdiv>\n                    <div style=\"font-size:12px;font-weight:700;color:#2B2420\">Igual<\u002Fdiv>\n                  <\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ onFeedbackBad }}\" style=\"display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 20px;border-radius:16px;border:1.5px solid #E7DFD2;background:#fff;cursor:pointer\">\n                    <div style=\"font-size:30px\">👎<\u002Fdiv>\n                    <div style=\"font-size:12px;font-weight:700;color:#2B2420\">No, peor<\u002Fdiv>\n                  <\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ isCheckinDone }}\">\n              <div style=\"display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;padding-top:20px;animation:popIn .4s ease\">\n                <div style=\"width:70px;height:70px;border-radius:50%;background:#7C8C68;display:flex;align-items:center;justify-content:center\">\n                  <svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M4 12l6 6L20 6\" stroke=\"#FAF3EA\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                <\u002Fdiv>\n                <div style=\"font-family:'Instrument Serif',serif;font-size:22px;color:#2B2420\">Qué bueno leer eso<\u002Fdiv>\n                <div style=\"font-size:13.5px;color:#6B6058;max-width:260px;line-height:1.5\">Gracias por completar tu check-in. Sigue con tu turno a tu ritmo.<\u002Fdiv>\n                <button sc-camel-on-click=\"{{ finishCheckinDone }}\" style=\"width:100%;padding:15px;border:none;border-radius:14px;background:#2B2420;color:#FAF3EA;font-weight:700;font-size:14.5px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif\">Continuar<\u002Fbutton>\n                <div style=\"font-size:12px;color:#9A8F84\">+5 pts por completar tu check-in<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ isCheckinEscalate }}\">\n              <div style=\"display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;padding-top:16px;animation:popIn .4s ease\">\n                <div style=\"font-size:34px\">🤝<\u002Fdiv>\n                <div style=\"font-family:'Instrument Serif',serif;font-size:22px;color:#2B2420\">Vale la pena hablar con alguien<\u002Fdiv>\n                <div style=\"font-size:13.5px;color:#6B6058;max-width:280px;line-height:1.5\">Probamos 3 estrategias y no lograron ayudarte hoy. Salud Ocupacional puede acompañarte mejor en este momento.<\u002Fdiv>\n                <button sc-camel-on-click=\"{{ openLikert }}\" style=\"width:100%;padding:15px;border:none;border-radius:14px;background:#2B2420;color:#FAF3EA;font-weight:700;font-size:14.5px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif\">Ir a Salud Ocupacional<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ closeOverlay }}\" style=\"width:100%;padding:15px;border:1.5px solid #E7DFD2;border-radius:14px;background:#fff;color:#2B2420;font-weight:700;font-size:14.5px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif\">Ahora no<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ isCertificados }}\">\n              <div style=\"display:flex;flex-direction:column;gap:12px\">\n                <div style=\"font-size:13.5px;color:#6B6058;line-height:1.5\">Reconocimientos simbólicos que su equipo ha ganado juntos.<\u002Fdiv>\n                <sc-for list=\"{{ certificados }}\" as=\"c\" hint-placeholder-count=\"3\">\n                  <div style=\"padding:16px;border-radius:16px;background:#fff;border:1.5px dashed #D9A441;display:flex;gap:14px;align-items:flex-start\">\n                    <div style=\"font-size:28px\">{{ c.emoji }}<\u002Fdiv>\n                    <div>\n                      <div style=\"font-size:14.5px;font-weight:700;color:#2B2420\">{{ c.titulo }}<\u002Fdiv>\n                      <div style=\"margin-top:2px;font-size:11.5px;color:#8A7F73;font-weight:700\">{{ c.fecha }}<\u002Fdiv>\n                      <div style=\"margin-top:5px;font-size:12.5px;color:#6B6058;line-height:1.45\">{{ c.descripcion }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ isResumenSemanal }}\">\n              <div style=\"display:flex;flex-direction:column;gap:18px\">\n                <div style=\"font-size:13.5px;color:#6B6058;line-height:1.5\">Un vistazo simple a cómo te sentiste esta semana. Solo tú lo ves.<\u002Fdiv>\n                <div style=\"display:flex;justify-content:space-between;gap:8px\">\n                  <sc-for list=\"{{ weeklyMoods }}\" as=\"w\" hint-placeholder-count=\"5\">\n                    <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 4px;border-radius:14px;background:#F1E8DB\">\n                      <div style=\"font-size:24px\">{{ w.emoji }}<\u002Fdiv>\n                      <div style=\"font-size:11px;font-weight:700;color:#8A7F73\">{{ w.day }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"padding:16px;border-radius:16px;background:#E4E9DA\">\n                  <div style=\"font-size:13px;color:#5F6B4F;line-height:1.55\">Esta semana predominó la calma, con un pico de estrés el viernes. Tus pausas y check-ins te están ayudando a sobrellevar los días más pesados.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ isLikert }}\">\n              <div style=\"display:flex;flex-direction:column;gap:20px\">\n                <div style=\"font-size:13.5px;color:#6B6058;line-height:1.5\">Voluntario. Tu resultado solo llega a Salud Ocupacional si diste ese consentimiento. Aquí solo verás \"completado\".<\u002Fdiv>\n                <sc-for list=\"{{ likertQuestions }}\" as=\"q\" hint-placeholder-count=\"5\">\n                  <div style=\"display:flex;flex-direction:column;gap:10px\">\n                    <div style=\"font-size:14px;font-weight:600;color:#2B2420;line-height:1.4\">{{ q.texto }}<\u002Fdiv>\n                    <div style=\"display:flex;gap:6px\">\n                      <sc-for list=\"{{ q.scaleOptions }}\" as=\"s\" hint-placeholder-count=\"5\">\n                        <button sc-camel-on-click=\"{{ s.onClick }}\" style=\"flex:1;padding:10px 0;border-radius:10px;border:1.5px solid #E7DFD2;background:{{ s.bg }};color:{{ s.color }};font-weight:700;font-size:13px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif\">{{ s.value }}<\u002Fbutton>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"display:flex;justify-content:space-between;font-size:11px;color:#9A8F84;padding:0 2px\">\n                  <span>Muy en desacuerdo<\u002Fspan><span>Muy de acuerdo<\u002Fspan>\n                <\u002Fdiv>\n                <button sc-camel-on-click=\"{{ submitLikert }}\" disabled=\"{{ !likertAllAnswered }}\" style=\"width:100%;padding:15px;border:none;border-radius:14px;background:{{ likertSubmitBg }};color:#FAF3EA;font-weight:700;font-size:14.5px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif\">Enviar<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ isLikertDone }}\">\n              <div style=\"display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:20px;animation:popIn .4s ease\">\n                <div style=\"width:70px;height:70px;border-radius:50%;background:#7C8C68;display:flex;align-items:center;justify-content:center\">\n                  <svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M4 12l6 6L20 6\" stroke=\"#FAF3EA\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                <\u002Fdiv>\n                <div style=\"font-family:'Instrument Serif',serif;font-size:22px;color:#2B2420\">Completado ✓<\u002Fdiv>\n                <div style=\"font-size:13.5px;color:#6B6058;max-width:260px;line-height:1.5\">Gracias. Tu resultado no es visible aquí ni para tu equipo — solo suma tus puntos.<\u002Fdiv>\n                <button sc-camel-on-click=\"{{ closeOverlay }}\" style=\"width:100%;padding:15px;border:none;border-radius:14px;background:#2B2420;color:#FAF3EA;font-weight:700;font-size:14.5px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif\">Volver a inicio<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ isAjustes }}\">\n              <div style=\"display:flex;flex-direction:column;gap:14px\">\n                <button sc-camel-on-click=\"{{ toggleConsentBase }}\" style=\"text-align:left;display:flex;gap:12px;padding:16px;border-radius:16px;border:1.5px solid {{ consentBaseBorder }};background:{{ consentBaseBg }};cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif\">\n                  <div style=\"width:22px;height:22px;flex:none;border-radius:7px;border:1.5p
